name: CI
on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a   # v4
      with:
        enable-cache: true
    - run: uv sync --python 3.12 --frozen --all-groups
    - run: uv run --python 3.12 ruff check .
    - run: uv run --python 3.12 ruff format --check .
    - run: uv run --python 3.12 mypy
    - run: uv tool install pre-commit==4.6.1
    - run: uv run --python 3.12 pytest -q
    - run: docker build --no-cache --tag restaurant-live-ops-worker:ci .

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: app/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run build
    - run: npm audit --audit-level=high
    - run: npm audit --omit=dev --audit-level=high

  supabase:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
    - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1   # v1.7.1
      with:
        version: 2.84.2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a   # v4
      with:
        enable-cache: true
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: app/package-lock.json
    - run: uv sync --python 3.12 --frozen --all-groups --project worker
    - run: npm ci --prefix app
    - run: supabase start
    - run: supabase db reset --local
    - run: bash scripts/test-supabase-local.sh
    - run: supabase db advisors --local --type security

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a   # v4
      with:
        enable-cache: true
    - run: uv sync --python 3.12 --frozen --all-groups --project worker
    - run: uv run --python 3.12 --project worker python scripts/check_repository_hygiene.py .
    - run: uv run --python 3.12 --project worker python scripts/check_repository_hygiene.py --git-archive .
    - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_VERSION: 8.30.1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
