# Servicio "staffing": personal fichado y asignado, cada 15 minutos.
#
# Va separado del servicio de venta a propósito: son dos fuentes con fallos
# independientes, y un cuelgue de Chromium no debe dejar sin datos al personal
# ni al revés. Cada uno tiene su propia fila en ingest_runs y su propia marca
# de frescura en pantalla.
#
# Solo hace peticiones HTTP —doce por ciclo, cuatro por restaurante— y tarda
# unos cinco segundos. No necesita Chromium, pero comparte la imagen con los
# demás servicios para no mantener dos Dockerfiles.

[build]
builder = "DOCKERFILE"
dockerfilePath = "worker/Dockerfile"

[deploy]
startCommand = "/app/.venv/bin/restaurant-live-ops-worker staffing"
# El cron está expresado en UTC; cada instalación debe ajustarlo a su horario.
cronSchedule = "*/15 0-3,5-23 * * *"
restartPolicyType = "NEVER"
