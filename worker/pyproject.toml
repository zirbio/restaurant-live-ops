[project]
name = "restaurant-live-ops-worker"
version = "0.1.0"
description = "Worker neutral de ingesta diaria de venta y personal hacia Supabase"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
restaurant-live-ops-worker = "restaurant_live_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_live_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# T20 prohíbe print() olvidado; DTZ prohíbe datetime sin zona horaria — la
# regla que impide que "hoy" se calcule en UTC en un servidor de Railway.
select = ["E", "F", "I", "UP", "B", "T20", "DTZ", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
