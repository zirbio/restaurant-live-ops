minimum_pre_commit_version: 4.6.1
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Commit verificado para la etiqueta v8.30.1.
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # Ruff queda fijado por worker/uv.lock. Ambos hooks son verificadores
      # puros: un release nunca reescribe el árbol que está validando.
      - id: ruff-check
        name: ruff check
        entry: uv run --python 3.12 --directory worker ruff check .
        language: system
        pass_filenames: false
        files: ^worker/
      - id: ruff-format
        name: ruff format
        entry: uv run --python 3.12 --directory worker ruff format --check .
        language: system
        pass_filenames: false
        files: ^worker/
      - id: mypy
        name: mypy
        entry: uv run --python 3.12 --directory worker mypy
        language: system
        pass_filenames: false
        files: ^worker/.*\.py$
      - id: app-lint
        name: app lint
        entry: npm --prefix app run lint
        language: system
        pass_filenames: false
        files: ^app/
      - id: app-typecheck
        name: app typecheck
        entry: npm --prefix app run typecheck
        language: system
        pass_filenames: false
        files: ^app/
      - id: repository-hygiene
        name: repository hygiene
        entry: uv run --python 3.12 --project worker python scripts/check_repository_hygiene.py .
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --python 3.12 --directory worker pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
